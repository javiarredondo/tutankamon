<title>Cámara de Tutankamón</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: escena 3D a pantalla completa; interfaz en capas tipo cartela de museo,
   anclada a los bordes. Estética oscura deliberada (un solo tema). */
:root {
  --ink: #0e0b08;          /* fondo de sala */
  --panel: rgba(22, 17, 12, 0.88);
  --panel-solid: #17120d;
  --line: rgba(201, 162, 74, 0.24);
  --line-strong: rgba(201, 162, 74, 0.55);
  --fg: #ece2cf;           /* texto: tono papiro */
  --muted: #a8987f;
  --gold: #cfa64e;         /* acento: pan de oro */
  --gold-deep: #8a6a26;
  --lapis: #8ea6e0;        /* interpretación */
  --carnelian: #dd8a6a;    /* por verificar */
  --display: "Marcellus", "Trajan Pro", Georgia, serif;
  --body: "Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 3px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --top: max(14px, env(safe-area-inset-top, 0px));
  --bottom: max(14px, env(safe-area-inset-bottom, 0px));
  color-scheme: dark;
}

html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--fg);
  font: 16px/1.5 var(--body);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

#app { position: fixed; inset: 0; overflow: hidden; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#labels { position: absolute; inset: 0; pointer-events: none; z-index: 0; isolation: isolate; overflow: hidden; }
.topbar, .tools, .layers, .guide, .gallery-bar, .hint, .disclaimer { z-index: 2; }

/* ---------- barra superior ---------- */
.topbar {
  position: absolute; top: var(--top); left: var(--gutter-l); right: var(--gutter-r);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.brand-kicker {
  display: block; font: 500 11px/1.2 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}
.brand-title {
  margin: 4px 0 0; font: 400 clamp(22px, 2.6vw, 30px)/1.1 var(--display); letter-spacing: .04em; color: var(--fg);
  text-wrap: balance;
}
.modes {
  display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: var(--r);
  background: var(--panel); backdrop-filter: blur(6px);
}
.mode {
  border: 0; background: transparent; padding: 7px 14px; border-radius: 2px; cursor: pointer;
  font-size: 14px; letter-spacing: .02em; color: var(--muted);
}
.mode:hover { color: var(--fg); }
.mode[aria-selected="true"] { background: rgba(207,166,78,.16); color: var(--gold); }

/* ---------- herramientas ---------- */
.tools {
  position: absolute; right: var(--gutter-r); top: calc(var(--top) + 54px);
  display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end;
}
.tool {
  border: 1px solid var(--line); background: var(--panel); padding: 7px 12px; border-radius: var(--r);
  font-size: 13.5px; cursor: pointer; color: var(--fg); backdrop-filter: blur(6px);
}
.tool:hover:not(:disabled) { border-color: var(--line-strong); }
.tool[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.tool:disabled, .btn:disabled { opacity: .4; cursor: default; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ---------- lista de capas ---------- */
.layers {
  position: absolute; left: var(--gutter-l); top: calc(var(--top) + 78px);
  width: 236px; padding: 12px 12px 10px; border: 1px solid var(--line); border-radius: var(--r);
  background: var(--panel); backdrop-filter: blur(6px);
}
.layers-head {
  margin: 0 0 8px; display: flex; justify-content: space-between; align-items: baseline;
  font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}
.layers ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.layer {
  display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: center;
  width: 100%; text-align: left; border: 0; background: transparent; padding: 5px 6px; border-radius: 2px;
  font-size: 14px; line-height: 1.25; color: var(--muted); cursor: default;
}
.layers.interactive .layer { cursor: pointer; }
.layers.interactive .layer:hover { background: rgba(207,166,78,.08); color: var(--fg); }
.layer .n { font: 500 11px/1 var(--mono); text-align: center; padding: 4px 0; border-radius: 50%; border: 1px solid var(--line); }
.layer.opened { color: var(--fg); }
.layer.opened .n { background: var(--gold-deep); border-color: var(--gold-deep); color: var(--fg); }
.layer.current { color: var(--gold); }
.layer.current .n { border-color: var(--gold); color: var(--gold); }
.layer.group-start { margin-top: 6px; }
.layers-note { margin: 10px 0 0; font-size: 12.5px; line-height: 1.35; color: var(--muted); }

/* ---------- cartela guiada ---------- */
.guide {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--bottom) + 26px);
  width: min(560px, calc(100% - 32px)); padding: 16px 18px 14px;
  border: 1px solid var(--line); border-top: 2px solid var(--gold-deep); border-radius: var(--r);
  background: var(--panel); backdrop-filter: blur(8px);
}
.guide-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.eyebrow { font: 500 11px/1.2 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.progress { display: flex; gap: 4px; }
.progress i { display: block; width: 14px; height: 3px; background: rgba(236,226,207,.16); }
.progress i.on { background: var(--gold); }
.progress i.cur { background: var(--fg); }
.guide-title { margin: 8px 0 4px; font: 400 21px/1.2 var(--display); letter-spacing: .02em; text-wrap: balance; }
.guide-text { margin: 0; font-size: 15.5px; line-height: 1.5; color: var(--fg); opacity: .88; max-width: 62ch; }
.guide-actions { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; flex-wrap: wrap; }
.guide.compact .guide-text { display: none; }
.btn {
  border: 1px solid var(--line); background: transparent; color: var(--fg);
  padding: 8px 14px; border-radius: var(--r); cursor: pointer; font-size: 14.5px;
}
.btn:hover:not(:disabled) { border-color: var(--line-strong); }
.btn.primary { background: var(--gold); border-color: var(--gold); color: #1a1308; font-weight: 700; }
.btn.primary:hover:not(:disabled) { background: #dcb563; }
.btn.ghost { color: var(--muted); }

@media (min-width: 761px) {
  .panel-open .guide { left: calc((100% - min(400px, 100% - 32px) - 16px) / 2); width: min(520px, calc(100% - 460px)); }
  .panel-open .gallery-bar { right: calc(min(400px, 100% - 32px) + 24px); }
}

/* ---------- galería ---------- */
.gallery-bar {
  position: absolute; left: var(--gutter-l); right: var(--gutter-r); bottom: calc(var(--bottom) + 26px);
  display: flex; justify-content: center;
}
.chips {
  display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 900px;
  padding: 6px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); backdrop-filter: blur(6px);
}
.chip {
  border: 1px solid transparent; background: transparent; padding: 6px 11px; border-radius: 2px;
  font-size: 14px; color: var(--muted); cursor: pointer; white-space: nowrap;
}
.chip:hover { color: var(--fg); }
.chip[aria-selected="true"] { border-color: var(--gold); color: var(--gold); }

/* ---------- ficha ---------- */
.panel {
  position: absolute; right: var(--gutter-r); top: calc(var(--top) + 98px); bottom: calc(var(--bottom) + 26px);
  width: min(400px, calc(100% - 32px));
  border: 1px solid var(--line); border-radius: var(--r); background: var(--panel-solid);
  box-shadow: 0 12px 40px rgba(0,0,0,.45);
  display: flex; flex-direction: column; z-index: 5;
}
.panel-close {
  position: absolute; top: 6px; right: 6px; width: 34px; height: 34px; border: 0; background: transparent;
  color: var(--muted); font-size: 24px; line-height: 1; cursor: pointer; border-radius: 2px;
}
.panel-close:hover { color: var(--fg); }
.panel-body { overflow-y: auto; padding: 20px 20px 18px; overscroll-behavior: contain; }
.panel-body h2 { margin: 6px 36px 6px 0; font: 400 25px/1.15 var(--display); letter-spacing: .02em; text-wrap: balance; }
.p-kicker { font: 500 11px/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.p-model {
  display: inline-block; margin: 4px 0 10px; padding: 3px 8px; border: 1px dashed var(--line-strong);
  font: 500 11.5px/1.3 var(--mono); color: var(--gold); border-radius: 2px;
}
.p-model-note { margin: 0 0 14px; font-size: 13.5px; color: var(--muted); line-height: 1.4; }
.p-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 16px; }
.p-actions:empty { display: none; }
.panel dl { margin: 0; display: grid; gap: 12px; }
.panel dt { font: 500 11px/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.panel dd { margin: 3px 0 0; font-size: 15px; line-height: 1.5; }
.p-section { margin: 20px 0 8px; padding-top: 12px; border-top: 1px solid var(--line);
  font: 500 11px/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.facts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.fact { display: grid; grid-template-columns: 1fr; gap: 4px; font-size: 14.5px; line-height: 1.45; }
.badge {
  justify-self: start; font: 500 10.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase;
  padding: 4px 6px; border-radius: 2px; border: 1px solid currentColor;
}
.badge.doc { color: var(--gold); }
.badge.int { color: var(--lapis); }
.badge.ver { color: var(--carnelian); }
.sources { margin: 0; padding-left: 18px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
.sources a { color: var(--fg); text-underline-offset: 2px; word-break: break-word; }
.legend { margin-top: 18px; font-size: 12.5px; color: var(--muted); line-height: 1.45; display: grid; gap: 4px; }

/* ---------- etiquetas 3D ---------- */
.label3d {
  font: 500 12px/1.2 var(--body); color: var(--fg); white-space: nowrap;
  padding: 3px 7px 3px 5px; border-left: 2px solid var(--gold); background: rgba(14,11,8,.72);
  transform: translateY(-10px); letter-spacing: .01em;
}
.label3d b { font: 500 11px/1 var(--mono); color: var(--gold); margin-right: 6px; }
.label3d.floor { border-left-color: var(--muted); color: var(--muted); font-size: 11px; background: transparent; }

/* ---------- avisos ---------- */
.hint, .disclaimer {
  position: absolute; bottom: var(--bottom); margin: 0; font-size: 12px; color: var(--muted); pointer-events: none;
}
.hint { left: var(--gutter-l); }
.disclaimer { right: var(--gutter-r); font-family: var(--mono); font-size: 11px; letter-spacing: .02em; }
.loading {
  position: absolute; inset: 0; display: grid; place-items: center; background: var(--ink);
  font: 400 18px/1 var(--display); letter-spacing: .06em; color: var(--muted); transition: opacity .6s;
}
.loading.done { opacity: 0; pointer-events: none; }
.error {
  position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); width: min(460px, calc(100% - 32px));
  padding: 18px; border: 1px solid var(--carnelian); background: var(--panel-solid); color: var(--fg); border-radius: var(--r);
}

/* ---------- pantallas medianas y móviles ---------- */
@media (min-width: 761px) and (max-width: 1150px) {
  .hint { display: none; }
  .guide { left: calc(256px + (100% - 256px) / 2); width: min(520px, calc(100% - 288px)); }
  .panel-open .guide { left: calc(256px + (100% - 256px - min(400px, 100% - 32px) - 16px) / 2); width: min(460px, calc(100% - 700px)); }
}
@media (min-width: 761px) and (max-width: 1150px) and (max-height: 700px) {
  .layers { max-height: calc(100% - 330px); overflow: auto; }
}
@media (max-width: 980px) {
  .layers { width: 200px; }
  .layer { font-size: 13px; }
}
@media (max-width: 760px) {
  .topbar { flex-direction: column; gap: 8px; }
  .modes { width: 100%; }
  .mode { flex: 1; padding: 7px 4px; font-size: 13px; }
  .brand-title { font-size: 21px; }
  .tools { top: calc(var(--top) + 100px); right: var(--gutter-r); left: var(--gutter-l); justify-content: flex-start; }
  .tool { font-size: 12.5px; padding: 6px 9px; }
  .layers { display: none; }
  .guide { bottom: calc(var(--bottom) + 16px); padding: 12px 14px 10px; }
  .guide-title { font-size: 18px; margin-top: 6px; }
  .guide-text { font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .btn { padding: 7px 10px; font-size: 13.5px; }
  .gallery-bar { bottom: calc(var(--bottom) + 16px); }
  .chip { font-size: 13px; padding: 5px 8px; }
  .panel { top: auto; bottom: 0; right: 0; left: 0; width: auto; max-height: 62%;
    border-radius: 8px 8px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .panel-body { padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
  .hint, .disclaimer { display: none; }
}

/* ---------- fundidos de interfaz ---------- */
@keyframes ui-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes ui-in-center { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translateX(-50%); } }
.panel, .gallery-bar, .tools, .layers { animation: ui-in 0.28s cubic-bezier(0.4, 0, 0.2, 1); }
.guide { animation: ui-in-center 0.28s cubic-bezier(0.4, 0, 0.2, 1); }
.panel.closing { opacity: 0; transform: translateY(6px); transition: opacity 0.18s ease, transform 0.18s ease; }
.label3d { transition: opacity 0.3s ease; }

@media (prefers-reduced-motion: reduce) {
  .loading { transition: none; }
  .panel, .gallery-bar, .tools, .layers, .guide { animation: none; }
  .panel.closing { transition: none; }
}

</style>
<!-- precarga: evita la cascada de peticiones (main.js → scene.js → addons → three) -->
<div id="app">
  <canvas id="view" aria-label="Escena 3D de la cámara funeraria"></canvas>
  <div id="labels" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-kicker">KV62 · Valle de los Reyes</span>
      <h1 class="brand-title">Cámara de Tutankamón</h1>
    </div>
    <nav class="modes" role="tablist" aria-label="Modo">
      <button class="mode" role="tab" id="mode-discovery" data-mode="discovery" aria-selected="true">Descubrimiento</button>
      <button class="mode" role="tab" id="mode-free" data-mode="free" aria-selected="false">Exploración libre</button>
      <button class="mode" role="tab" id="mode-gallery" data-mode="gallery" aria-selected="false">Galería</button>
    </nav>
  </header>

  <div class="tools" id="tomb-tools">
    <button class="tool" id="btn-overview" aria-pressed="false" title="Ver todas las capas en su sitio, semitransparentes">Vista general</button>
    <button class="tool" id="btn-explode" aria-pressed="false" title="Separar las estructuras para verlas una a una">Capas separadas</button>
    <button class="tool" id="btn-reset" title="Cerrar todo y volver a la vista inicial">Restablecer</button>
    <button class="tool btn-quality" id="btn-quality" aria-pressed="false">Calidad</button>
  </div>
  <div class="tools" id="gallery-tools" hidden>
    <button class="tool" id="btn-autorotate" aria-pressed="true">Giro automático</button>
    <button class="tool" id="btn-gallery-info">Ficha</button>
    <button class="tool" id="btn-gallery-reset">Restablecer vista</button>
    <button class="tool btn-quality" id="btn-quality-gal" aria-pressed="false">Calidad</button>
  </div>

  <aside class="layers" id="layers" aria-label="Capas funerarias">
    <p class="layers-head">Capas <span id="layers-count" class="mono"></span></p>
    <ol id="layer-list"></ol>
    <p class="layers-note" id="layers-note"></p>
  </aside>

  <section class="guide" id="guide" aria-live="polite">
    <div class="guide-meta">
      <span class="eyebrow" id="guide-step"></span>
      <span class="progress" id="guide-progress" aria-hidden="true"></span>
    </div>
    <h2 class="guide-title" id="guide-title"></h2>
    <p class="guide-text" id="guide-text"></p>
    <div class="guide-actions">
      <button class="btn ghost" id="btn-prev">‹ Cerrar anterior</button>
      <button class="btn" id="btn-info">Ficha</button>
      <button class="btn primary" id="btn-next">Abrir ›</button>
    </div>
  </section>

  <section class="gallery-bar" id="gallery-bar" hidden aria-label="Objetos de la galería">
    <div class="chips" id="gallery-chips" role="listbox"></div>
  </section>

  <aside class="panel" id="panel" hidden aria-label="Ficha del objeto">
    <button class="panel-close" id="panel-close" aria-label="Cerrar ficha">×</button>
    <div class="panel-body" id="panel-body"></div>
  </aside>

  <p class="hint" id="hint">Arrastra para girar · rueda o pellizco para acercar · toca una pieza para ver su ficha</p>
  <p class="disclaimer">Modelos esquemáticos con proporciones aproximadas, no réplicas. Máscara 3D: Roberto Domínguez, CC BY 4.0.</p>

  <div class="loading" id="loading"><span>Preparando la cámara…</span></div>
  <div class="error" id="error" hidden></div>
</div>
